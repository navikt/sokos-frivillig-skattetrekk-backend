name: CodeQL Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  TZ: Europe/Oslo

jobs:
  codeql-scan:
    permissions:
      contents: read
      security-events: write
    name: CodeQL Scan
    uses: navikt/skatt-og-trekk-gha-workflows/.github/workflows/codeql-scan.yaml@b8cff5a3c59930ec72712250cb435a4e51d96bd4 # ratchet:navikt/skatt-og-trekk-gha-workflows/.github/workflows/codeql-scan.yaml@v1.1.2
    secrets: inherit
    with:
      language: 'kotlin'