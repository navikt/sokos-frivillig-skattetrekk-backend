name: Digestabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

env:
  TZ: Europe/Oslo

jobs:
  digestabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/skatt-og-trekk-gha-workflows/.github/workflows/digestabot-automerge.yaml@b8cff5a3c59930ec72712250cb435a4e51d96bd4 # ratchet:navikt/skatt-og-trekk-gha-workflows/.github/workflows/digestabot-automerge.yaml@v1.1.2
    name: Digestabot Auto-merge
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
